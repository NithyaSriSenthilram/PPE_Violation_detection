# ── Render Blueprint — SentinelVision AI (PPE detection), Free tier ───────
#
# Two free services:
#   ppe-detection-api       Docker web service (FastAPI + ONNX Runtime + FFmpeg)
#   ppe-detection-frontend  Static site built from frontend/ with Vite.
#
# Render Free means 512 MB RAM, a shared CPU, no persistent disk, and the
# service sleeps after 15 minutes without traffic (first request afterwards
# takes ~1 min while the models load). The image is sized for it: the
# hard-hat validator is the q4f16 build (see Dockerfile) and the whole stack
# measures ~270 MB with models loaded, ~400 MB peak during a 720p analysis
# and ~465 MB at 1080p — one job at a time (MAX_CONCURRENT_JOBS=1).
#
# Storage is ephemeral: uploads, annotated renders, evidence and the SQLite
# database live in the container and are wiped on every deploy, restart or
# sleep/wake cycle. Results must be downloaded while the service is up. Mount
# a disk at /var/data on a paid plan and nothing else needs to change.
#
# URLs are not hard-coded. Render prompts for the two `sync: false` values
# when the Blueprint is created; fill them in with the public URLs shown on
# each service (the frontend's for CORS_ORIGINS, the API's for VITE_API_URL).
# Changing VITE_API_URL later requires a frontend rebuild — it is baked in.

services:
  # ── Backend ─────────────────────────────────────────────────────────────
  - type: web
    name: ppe-detection-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    numInstances: 1  # in-process job pool + SQLite: never scale horizontally
    envVars:
      - key: PORT
        value: 10000
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: "true"
      # Ephemeral container storage on the free plan (no disk to mount).
      - key: DATA_ROOT
        value: /var/data
      # ONNX Runtime is the production inference backend. MAX/Mojo are not in
      # the image; /api/diagnostics reports what is actually running.
      - key: INFERENCE_BACKEND
        value: onnx
      - key: MOJO_ENABLED
        value: "off"
      # Free tier: one shared CPU and 512 MB. One intra-op thread, and no ORT
      # memory arena so scratch buffers are returned between runs.
      - key: INFERENCE_THREADS
        value: "1"
      - key: ONNX_CPU_MEM_ARENA
        value: "false"
      - key: AUTO_START_CAMERAS
        value: "false"
      # The ffmpeg finalise pass runs beside the Python process and counts
      # against the same 512 MB. One encoder thread and a 1280 px render cap
      # keep it under ~120 MB (auto threads at 1080p measured 407 MB).
      - key: ANNOTATED_FFMPEG_THREADS
        value: "1"
      # One analysis at a time: a second concurrent job would double the
      # transient buffers and exceed the instance. Further uploads queue.
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: ANNOTATED_MAX_WIDTH
        value: "1280"
      # Large uploads are slow to analyse on a shared CPU and the container
      # has no disk to spare; raise this on a paid instance.
      - key: MAX_UPLOAD_MB
        value: "200"
      # Allowed browser origins: the static site's public URL, e.g.
      # https://<frontend-service>.onrender.com (comma-separated for several).
      - key: CORS_ORIGINS
        sync: false
      # Optional shared secret. Leave empty for no auth; if set, the frontend
      # must be built with the same value in VITE_API_KEY.
      - key: API_KEY
        value: ""

  # ── Frontend ────────────────────────────────────────────────────────────
  - type: web
    name: ppe-detection-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Public URL of the API service, e.g. https://<api-service>.onrender.com
      # (build-time; rebuild after changing it).
      - key: VITE_API_URL
        sync: false
      - key: VITE_API_KEY
        value: ""
      - key: NODE_VERSION
        value: "20"
    routes:
      # Single-page app: every path is served by index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
